name: Build APK
run-name: build ${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      build_id: { description: "Build ID", required: true }
      app_name: { description: "Application name", required: true }
      website_url: { description: "Website URL", required: true }
      logo_url: { description: "Logo URL", required: true }
      package_id: { description: "Android package id", required: true }

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_NAME: ${{ inputs.app_name }}
      WEBSITE_URL: ${{ inputs.website_url }}
      LOGO_URL: ${{ inputs.logo_url }}
      PACKAGE_ID: ${{ inputs.package_id }}
    steps:
      - name: Prepare project
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate Android project
        run: |
          pip install --quiet pillow
          python3 - <<'PY'
          import os, re, io, urllib.request
          from xml.sax.saxutils import escape
          from PIL import Image

          name = os.environ["APP_NAME"]
          url = os.environ["WEBSITE_URL"]
          pkg = os.environ["PACKAGE_ID"]
          assert re.fullmatch(r"[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+", pkg), "bad package"
          assert re.match(r"^https?://", url), "bad url"

          def w(path, text):
              os.makedirs(os.path.dirname(path) or ".", exist_ok=True)
              open(path, "w").write(text)

          w("app/settings.gradle", """pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "webapk"
          include ':app'
          """)
          w("app/build.gradle", """plugins { id 'com.android.application' version '8.5.2' apply false }
          """)
          w("app/gradle.properties", "android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2g\n")
          w("app/app/build.gradle", f"""plugins {{ id 'com.android.application' }}
          android {{
              namespace 'app.webview'
              compileSdk 34
              defaultConfig {{
                  applicationId '{pkg}'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }}
              compileOptions {{
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }}
          }}
          """)
          w("app/app/src/main/AndroidManifest.xml", """<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <application android:label="@string/app_name" android:icon="@mipmap/ic_launcher"
                android:roundIcon="@mipmap/ic_launcher" android:usesCleartextTraffic="true"
                android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true"
                  android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          """)
          safe = escape(name).replace("'", "\\'").replace('"', '\\"').replace("@", "\\@").replace("?", "\\?")
          w("app/app/src/main/res/values/strings.xml",
            f'<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <string name="app_name">{safe}</string>\n  <string name="start_url">{escape(url)}</string>\n</resources>\n')
          w("app/app/src/main/java/app/webview/MainActivity.java", """package app.webview;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.*;

          public class MainActivity extends Activity {
              private WebView web;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  web = new WebView(this);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setSupportZoom(false);
                  CookieManager.getInstance().setAcceptCookie(true);
                  web.setWebChromeClient(new WebChromeClient());
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          String scheme = r.getUrl().getScheme();
                          if ("http".equals(scheme) || "https".equals(scheme)) return false;
                          try { startActivity(new Intent(Intent.ACTION_VIEW, r.getUrl())); } catch (Exception e) {}
                          return true;
                      }
                  });
                  setContentView(web);
                  if (state != null) web.restoreState(state);
                  else web.loadUrl(getString(R.string.start_url));
              }

              @Override protected void onSaveInstanceState(Bundle o) { super.onSaveInstanceState(o); web.saveState(o); }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack(); else super.onBackPressed();
              }
          }
          """)

          req = urllib.request.Request(os.environ["LOGO_URL"], headers={"User-Agent": "apk-builder"})
          img = Image.open(io.BytesIO(urllib.request.urlopen(req).read())).convert("RGBA")
          side = max(img.size)
          sq = Image.new("RGBA", (side, side), (255, 255, 255, 0))
          sq.paste(img, ((side - img.width) // 2, (side - img.height) // 2))
          for d, px in {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}.items():
              p = f"app/app/src/main/res/mipmap-{d}"
              os.makedirs(p, exist_ok=True)
              sq.resize((px, px), Image.LANCZOS).save(f"{p}/ic_launcher.png")
          print("Project generated for", pkg)
          PY

      - name: Build APK
        working-directory: app
        run: gradle assembleDebug --no-daemon -q

      - name: Finalize download
        run: |
          SLUG=$(echo "$APP_NAME" | tr -cs 'A-Za-z0-9' '-' | sed 's/^-*//;s/-*$//')
          mkdir -p out
          cp app/app/build/outputs/apk/debug/app-debug.apk "out/${SLUG:-app}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk
          retention-days: 3
